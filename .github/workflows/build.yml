
name: Build and Upload APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Extract Zip File
        run: |
          if [ -f "Silchar_Salmiya_Azan_AtoZ.zip" ]; then
            unzip -o "Silchar_Salmiya_Azan_AtoZ.zip" -d extracted_app
          else
            echo "Zip file not found!"
            exit 1
          fi

      - name: Build Flutter APK
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml file not found inside extracted folder!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          mkdir -p /tmp/output
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baskandi-Azan-APK
          path: /tmp/output/app-release.apk
