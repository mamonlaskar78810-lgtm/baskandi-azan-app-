import 'package:flutter_local_notifications/flutter_local_notifications.dart';
import 'package:timezone/data/latest_all.dart' as tz;
import 'package:timezone/timezone.dart' as tz;
import 'alarm_service.dart';

class NotificationService {
  static final FlutterLocalNotificationsPlugin _notificationsPlugin =
      FlutterLocalNotificationsPlugin();

  static Future<void> initNotification() async {
    tz.initializeTimeZones();
    
    const AndroidInitializationSettings androidSettings =
        AndroidInitializationSettings('@mipmap/ic_launcher');

    const InitializationSettings initSettings =
        InitializationSettings(android: androidSettings);

    await _notificationsPlugin.initialize(
      initSettings,
      onDidReceiveNotificationResponse: (NotificationResponse response) async {
        if (response.payload == 'stop_azan') {
          await AlarmService.stopAzan();
        }
      },
    );
  }

  // শিডিউল অনুযায়ী আজান ও নোটিফিকেশন বাজানোর ফংশন
  static Future<void> scheduleAzanNotification({
    required int id,
    required String title,
    required String body,
    required DateTime scheduledTime,
  }) async {
    await _notificationsPlugin.zonedSchedule(
      id,
      title,
      body,
      tz.TZDateTime.from(scheduledTime, tz.local),
      const NotificationDetails(
        android: AndroidNotificationDetails(
          'azan_channel',
          'Azan Notifications',
          channelDescription: 'Channel for Azan Alarms',
          importance: Importance.max,
          priority: Priority.high,
          fullScreenIntent: true,
          sound: RawResourceAndroidNotificationSound('azan'),
        ),
      ),
      androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
      uiLocalNotificationDateInterpretation:
          UILocalNotificationDateInterpretation.absoluteTime,
    );
  }
}
import 'alarm_service.dart';
import 'notification_service.dart';

class AzanScheduler {
  // নামাজের কাস্টম সময়সূচি (প্রয়োজন অনুযায়ী পরিবর্তনযোগ্য)
  static final Map<String, String> defaultPrayerTimes = {
    'ফজর': '05:00',
    'জোহর': '12:15',
    'আসর': '15:45',
    'মাগরিব': '18:10',
    'এশা': '19:30',
  };

  static Future<void> setupDailyAlarms() async {
    int id = 0;
    final now = DateTime.now();

    defaultPrayerTimes.forEach((name, time) async {
      final parts = time.split(':');
      final hour = int.parse(parts[0]);
      final minute = int.parse(parts[1]);

      var scheduledDate = DateTime(now.year, now.month, now.day, hour, minute);
      
      if (scheduledDate.isBefore(now)) {
        scheduledDate = scheduledDate.add(const Duration(days: 1));
      }

      await NotificationService.scheduleAzanNotification(
        id: id++,
        title: '$name-এর আজান',
        body: 'বাঁশকান্দি মাদ্রাসা আজানের সময় হয়েছে',
        scheduledTime: scheduledDate,
      );
    });
  }
}import 'package:flutter/material.dart';
import 'services/alarm_service.dart';
import 'services/notification_service.dart';
import 'services/azan_scheduler.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await NotificationService.initNotification();
  await AzanScheduler.setupDailyAlarms();
  runApp(const BaskandiAzanApp());
}

